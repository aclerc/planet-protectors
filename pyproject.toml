[project]
name = "planet_protectors"
dynamic = ["version"]
description = "Pina defends seven planets from invading animals - a father-daughter game"
authors = [
    { name = "Alex Clerc" }
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pygame-ce>=2.5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2.2",
    "poethepoet>=0.27.0",
    "ruff>=0.5.0",
    "mypy>=1.10.1",
    "coverage>=7.5.4",
    "deptry>=0.20.0",
]
web = [
    "pygbag>=0.9.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/planet_protectors/__init__.py"

[tool.ruff]
line-length = 120
target-version = "py312"
show-fixes = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D203", # `one-blank-line-before-class` conflicts with D211 `blank-line-before-class`
    "D213", # 'multi-line-summary-second-line' conflicts with D212 'multi-line-summary-starts-with-capital-letter'
    "COM812", # can conflict with formatter
    "ISC001", # can conflict with formatter
    "ANN204", # `__init__` doesn't need annotations
    "CPY001", # no copyright header wanted on a family game
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["D"]
"main.py" = ["INP001"] # pygbag entry point, deliberately outside the package
"scripts/**/*.py" = ["INP001", "S603"] # build scripts shell out on purpose
"tests/**/*.py" = [
    "S101", # allow `assert`
    "PLR2004", # allow magic values
    "D100", # Missing docstring in public module
    "D101", # Missing docstring in public class
    "D102", # Missing docstring in public method
]

[tool.mypy]
python_version = "3.12"
exclude = ".venv|build"

[tool.deptry]
extend_exclude = ["main.py", "scripts"]

[tool.deptry.per_rule_ignores]
DEP002 = ["pygbag"] # used by `poe web`, not imported
DEP003 = ["planet_protectors"]

[tool.coverage.report]
exclude_lines = ["if __name__ == .__main__.:"]


[tool.poe.tasks]
[tool.poe.tasks.lint]
help = "Runs formater and linter"
sequence = [
    { cmd = "ruff format ." },
    { cmd = "ruff check . --fix" },
    { cmd = "mypy ." },
    { cmd = "deptry ." },
]

[tool.poe.tasks.lint-check]
help = "Checks using formater and linter"
sequence = [
    { cmd = "ruff format . --check" },
    { cmd = "ruff check ." },
    { cmd = "mypy ." },
    { cmd = "deptry ." },
]

[tool.poe.tasks.test]
help = "Runs unit tests and show coverage"
sequence = [
    { cmd = "coverage run --source src -m pytest ./tests" },
    { cmd = "coverage report -m" },
]

[tool.poe.tasks.web]
help = "Build and serve the browser (WASM) version"
cmd = "python scripts/build_web.py"

[tool.poe.tasks.web-build]
help = "Build the browser (WASM) version without serving it"
cmd = "python scripts/build_web.py --build"

[tool.poe.tasks.all]
help = "Run all required pre-push commands"
sequence = [{ ref = "lint" }, { ref = "test" }]
